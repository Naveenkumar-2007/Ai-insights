name: Build and Deploy to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: ai-insights-app
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '18.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Build React frontend
      working-directory: ./frontend
      env:
        CI: false
        REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
        REACT_APP_FIREBASE_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY }}
        REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}
        REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}
        REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}
        REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
        REACT_APP_FIREBASE_APP_ID: ${{ secrets.REACT_APP_FIREBASE_APP_ID }}
        REACT_APP_FIREBASE_MEASUREMENT_ID: ${{ secrets.REACT_APP_FIREBASE_MEASUREMENT_ID }}
        REACT_APP_ADMIN_EMAILS: ${{ secrets.REACT_APP_ADMIN_EMAILS }}
      run: npm run build

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install Python dependencies
      working-directory: ./VIONEX-finance-Ai-Stock-price-predictor-main
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Copy build to Flask static folder
      run: |
        rm -rf VIONEX-finance-Ai-Stock-price-predictor-main/build
        cp -r frontend/build VIONEX-finance-Ai-Stock-price-predictor-main/build

    - name: Create deployment package
      run: |
        cd VIONEX-finance-Ai-Stock-price-predictor-main
        zip -r ../deploy.zip . -x "*.git*" -x "*__pycache__*" -x "*.pyc"

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: deploy.zip

    - name: Configure Azure App Settings
      uses: azure/appservice-settings@v1
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        app-settings-json: |
          [
            {
              "name": "TWELVE_DATA_API_KEY",
              "value": "${{ secrets.TWELVE_DATA_API_KEY }}",
              "slotSetting": false
            },
            {
              "name": "FINNHUB_API_KEY",
              "value": "${{ secrets.FINNHUB_API_KEY }}",
              "slotSetting": false
            },
            {
              "name": "FIREBASE_SERVICE_ACCOUNT_PATH",
              "value": "/home/site/wwwroot/firebase-admin.json",
              "slotSetting": false
            },
            {
              "name": "ADMIN_EMAILS",
              "value": "${{ secrets.ADMIN_EMAILS }}",
              "slotSetting": false
            },
            {
              "name": "ALLOWED_ORIGINS",
              "value": "${{ secrets.ALLOWED_ORIGINS }}",
              "slotSetting": false
            },
            {
              "name": "SCM_DO_BUILD_DURING_DEPLOYMENT",
              "value": "true",
              "slotSetting": false
            }
          ]
        
    - name: Upload Firebase Service Account
      run: |
        echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > firebase-admin.json
        az webapp config storage-account add \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
          --custom-id firebase \
          --storage-type AzureBlob \
          --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
          --share-name config \
          --access-key ${{ secrets.AZURE_STORAGE_KEY }} \
          --mount-path /home/site/wwwroot
