name: Build and Deploy to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: azure-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: Aiinsight
  AZURE_RESOURCE_GROUP: Ai_insights
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '18.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Build React frontend
      working-directory: ./frontend
      env:
        CI: false
        REACT_APP_API_URL: https://aiinsight-fyhyenesh4d2hee9.centralindia-01.azurewebsites.net
        REACT_APP_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
        REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        REACT_APP_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        REACT_APP_FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
      run: npm run build

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install Python dependencies
      working-directory: ./VIONEX-finance-Ai-Stock-price-predictor-main
      run: |
        python -m pip install --upgrade pip
        # Just verify requirements.txt exists
        echo "Requirements file exists:"
        cat requirements.txt

    - name: Copy build to Flask static folder
      run: |
        rm -rf VIONEX-finance-Ai-Stock-price-predictor-main/build
        cp -r frontend/build VIONEX-finance-Ai-Stock-price-predictor-main/build

    - name: Add Firebase service account to deployment
      run: |
        echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > VIONEX-finance-Ai-Stock-price-predictor-main/firebase-admin.json
        chmod 600 VIONEX-finance-Ai-Stock-price-predictor-main/firebase-admin.json

    - name: Create deployment package
      run: |
        cd VIONEX-finance-Ai-Stock-price-predictor-main
        # Create package including requirements.txt for Oryx build
        zip -r ../deploy.zip . \
          -x ".git/*" \
          -x ".github/*" \
          -x "*__pycache__*" \
          -x "*.pyc" \
          -x "*/node_modules/*" \
          -x "*/frontend/*" \
          -x ".python_packages/*" \
          -x "logs_dir/*" \
          -x "*.zip" \
          -x "artifacts/*" \
          -x "mlops/*"
        
        # Check zip size
        ls -lh ../deploy.zip

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Stop the web app
      run: |
        echo "Stopping web app to prevent conflicts..."
        az webapp stop \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }}

    - name: Configure Azure App Settings
      run: |
        # Configure app settings
        echo "Configuring app settings..."
        az webapp config appsettings set \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --settings \
            TWELVE_DATA_API_KEY="${{ secrets.TWELVE_DATA_API_KEY }}" \
            FINNHUB_API_KEY="${{ secrets.FINNHUB_API_KEY }}" \
            ALPHA_VANTAGE_API_KEY="${{ secrets.ALPHA_VANTAGE_API_KEY }}" \
            FIREBASE_SERVICE_ACCOUNT_PATH="/home/site/wwwroot/firebase-admin.json" \
            ADMIN_EMAILS="${{ secrets.ADMIN_EMAILS }}" \
            ALLOWED_ORIGINS="https://aiinsight-fyhyenesh4d2hee9.centralindia-01.azurewebsites.net" \
            SCM_DO_BUILD_DURING_DEPLOYMENT="true" \
            ENABLE_ORYX_BUILD="true" \
            WEBSITES_PORT="8000" \
            PORT="8000" \
            WEBSITES_CONTAINER_START_TIME_LIMIT="1800" \
            ORYX_DISABLE_TELEMETRY="true"
        
        # Set startup command to just gunicorn
        echo "Setting startup command..."
        az webapp config set \
          --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
          --name "${{ env.AZURE_WEBAPP_NAME }}" \
          --startup-file "gunicorn --bind=0.0.0.0:8000 --timeout 120 --workers 1 --worker-class sync --access-logfile - --error-logfile - wsgi:app"

    - name: Deploy to Azure Web App
      run: |
        echo "=========================================="
        echo "Deploying to Azure Web App..."
        echo "=========================================="

        # Get deployment credentials
        CREDS=$(az webapp deployment list-publishing-credentials \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --query "{username:publishingUserName, password:publishingPassword}" \
          -o json)
        
        USERNAME=$(echo $CREDS | jq -r .username)
        PASSWORD=$(echo $CREDS | jq -r .password)
        
        # Deploy using Kudu API directly
        curl -X POST \
          "https://${USERNAME}:${PASSWORD}@aiinsight-fyhyenesh4d2hee9.scm.centralindia-01.azurewebsites.net/api/zipdeploy?isAsync=true" \
          -H "Content-Type: application/zip" \
          --data-binary @deploy.zip \
          -v

    - name: Start the web app
      run: |
        echo "Starting web app..."
        az webapp start \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }}

    - name: Wait for deployment
      run: |
        echo "Waiting for app to start..."
        sleep 120
        
        # Check deployment status
        for i in {1..10}; do
          status=$(az webapp show \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query state -o tsv)
          
          echo "App state: $status (attempt $i/10)"
          
          if [ "$status" == "Running" ]; then
            echo "✅ App is running!"
            break
          fi
          
          sleep 15
        done

    - name: Health Check
      run: |
        echo "Waiting for app to start..."
        sleep 60
        
        max_health_checks=5
        for i in $(seq 1 $max_health_checks); do
          echo "Health check attempt $i of $max_health_checks..."
          
          if curl -f -s -o /dev/null -w "%{http_code}" https://aiinsight-fyhyenesh4d2hee9.centralindia-01.azurewebsites.net/ | grep -q "200"; then
            echo "✅ App is responding successfully!"
            exit 0
          else
            echo "⚠️  App not ready yet, waiting 20 seconds..."
            sleep 20
          fi
        done
        
        echo "⚠️  App may still be starting. Check logs manually if needed."

    - name: Logout from Azure
      run: |
        az logout
