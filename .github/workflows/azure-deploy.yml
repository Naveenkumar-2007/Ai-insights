name: Build and Deploy to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: azure-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: Aiinsight
  AZURE_RESOURCE_GROUP: Ai_insights
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '18.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Build React frontend
      working-directory: ./frontend
      env:
        CI: false
        REACT_APP_API_URL: https://aiinsight-fyhyenesh4d2hee9.centralindia-01.azurewebsites.net
        REACT_APP_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
        REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        REACT_APP_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        REACT_APP_FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
      run: npm run build

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install Python dependencies
      working-directory: ./VIONEX-finance-Ai-Stock-price-predictor-main
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Copy build to Flask static folder
      run: |
        rm -rf VIONEX-finance-Ai-Stock-price-predictor-main/build
        cp -r frontend/build VIONEX-finance-Ai-Stock-price-predictor-main/build

    - name: Add Firebase service account to deployment
      run: |
        echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > VIONEX-finance-Ai-Stock-price-predictor-main/firebase-admin.json
        chmod 600 VIONEX-finance-Ai-Stock-price-predictor-main/firebase-admin.json

    - name: Create deployment package
      run: |
        cd VIONEX-finance-Ai-Stock-price-predictor-main
        zip -r ../deploy.zip . -x "*.git*" -x "*__pycache__*" -x "*.pyc" -x "*/node_modules/*" -x "*/frontend/*"

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Stop ongoing deployments and configure app
      run: |
        # Stop the app to clear any ongoing deployments
        echo "Stopping app to clear deployment locks..."
        az webapp stop --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }}
        
        # Wait for app to stop
        sleep 10
        
        # Remove WEBSITE_RUN_FROM_PACKAGE if it exists
        echo "Removing WEBSITE_RUN_FROM_PACKAGE setting..."
        az webapp config appsettings delete \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --setting-names WEBSITE_RUN_FROM_PACKAGE || true
        
        # Configure app settings
        echo "Configuring app settings..."
        az webapp config appsettings set \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --settings \
            TWELVE_DATA_API_KEY="${{ secrets.TWELVE_DATA_API_KEY }}" \
            FINNHUB_API_KEY="${{ secrets.FINNHUB_API_KEY }}" \
            FIREBASE_SERVICE_ACCOUNT_PATH="/home/site/wwwroot/firebase-admin.json" \
            ADMIN_EMAILS="${{ secrets.ADMIN_EMAILS }}" \
            ALLOWED_ORIGINS="https://aiinsight-fyhyenesh4d2hee9.centralindia-01.azurewebsites.net" \
            SCM_DO_BUILD_DURING_DEPLOYMENT="true" \
            ENABLE_ORYX_BUILD="true" \
            WEBSITES_PORT="8000" \
            PORT="8000"
        
        # Set startup command to use gunicorn config file
        echo "Setting startup command..."
        az webapp config set \
          --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
          --name "${{ env.AZURE_WEBAPP_NAME }}" \
          --startup-file "gunicorn --config gunicorn_config.py wsgi:app"
        
        # Start the app
        echo "Starting app..."
        az webapp start --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }}

    - name: Deploy to Azure Web App with retry
      run: |
        set -e
        attempts=0
        max_attempts=3
        sleep_secs=30
        
        while [ $attempts -lt $max_attempts ]; do
          echo "=========================================="
          echo "Deployment attempt $((attempts+1)) of $max_attempts..."
          echo "=========================================="
          
          # Try to deploy
          if az webapp deployment source config-zip \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --src deploy.zip \
            --timeout 1200; then
            echo "✅ Deployment succeeded!"
            exit 0
          else
            rc=$?
            echo "❌ Deployment attempt $((attempts+1)) failed with exit code $rc"
            attempts=$((attempts+1))
            
            if [ $attempts -lt $max_attempts ]; then
              echo "⏳ Waiting ${sleep_secs} seconds before retry..."
              echo "🔄 Restarting app to clear deployment locks..."
              
              # Stop and start app to clear locks
              az webapp stop --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }}
              sleep 10
              az webapp start --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }}
              
              sleep $sleep_secs
            else
              echo "❌ Max attempts reached. Deployment failed."
              echo "📋 Check deployment logs at: https://aiinsight-fyhyenesh4d2hee9.scm.centralindia-01.azurewebsites.net/api/deployments/latest"
              exit 1
            fi
          fi
        done

    - name: Verify deployment
      run: |
        echo "⏳ Waiting for app to fully start..."
        sleep 60
        
        echo "🔍 Checking application health..."
        max_health_checks=5
        for i in $(seq 1 $max_health_checks); do
          echo "Health check attempt $i of $max_health_checks..."
          
          if curl -f -s -o /dev/null -w "%{http_code}" https://aiinsight-fyhyenesh4d2hee9.centralindia-01.azurewebsites.net/ | grep -q "200"; then
            echo "✅ App is responding successfully!"
            exit 0
          else
            echo "⚠️  App not ready yet, waiting 20 seconds..."
            sleep 20
          fi
        done
        
        echo "⚠️  App may still be starting. Check logs manually if needed."

    - name: Logout from Azure
      run: |
        az logout
